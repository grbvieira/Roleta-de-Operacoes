name: Release Windows

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Testar e empacotar
    runs-on: windows-2025
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      installer: ${{ steps.version.outputs.installer }}
      sha256: ${{ steps.installer.outputs.sha256 }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Obter o código da tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Conferir versão e tag
        id: version
        run: npm.cmd run verify:release

      - name: Instalar dependências do lock
        run: npm.cmd ci

      - name: Testes unitários
        run: npm.cmd test

      - name: Testar a interface offline
        run: npm.cmd run test:desktop

      - name: Gerar instalador completo e ZIP
        run: npm.cmd run dist:win

      - name: Testar o executável offline
        run: npm.cmd run test:packaged

      - name: Conferir recursos e versão empacotados
        run: npm.cmd run verify:distribution

      - name: Conferir o instalador para publicação
        id: installer
        env:
          INSTALLER_NAME: ${{ steps.version.outputs.installer }}
        run: |
          $installerPath = Join-Path 'dist' $env:INSTALLER_NAME
          if (-not (Test-Path -LiteralPath $installerPath -PathType Leaf)) {
            throw "Instalador ausente: $installerPath"
          }
          if ((Get-Item -LiteralPath $installerPath).Length -le 10000000) {
            throw 'O instalador está incompleto.'
          }
          $checksum = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$checksum" >> $env:GITHUB_OUTPUT

      - name: Guardar instalador aprovado
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/${{ steps.version.outputs.installer }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publicar Release
    needs: build
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Obter scripts da mesma revisão
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Baixar somente o instalador aprovado
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release-artifacts

      - name: Anexar ao rascunho e publicar
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          APP_VERSION: ${{ needs.build.outputs.version }}
          INSTALLER_NAME: ${{ needs.build.outputs.installer }}
          INSTALLER_SHA256: ${{ needs.build.outputs.sha256 }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          retries: 0
          script: |
            const path = require('node:path');
            const publishRelease = require('./scripts/publish-release.cjs');
            await publishRelease({
              github, context, core,
              tag: process.env.RELEASE_TAG,
              version: process.env.APP_VERSION,
              installerPath: path.join('release-artifacts', process.env.INSTALLER_NAME),
              expectedSha256: process.env.INSTALLER_SHA256
            });
